<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | DRN TECH</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forgot_password.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

<div class="forgot-container">
    <div class="forgot-card">
        <a href="{{ url_for('home') }}" class="auth-brand-mark" aria-label="DRN TECH home">
            <img src="{{ url_for('static', filename='images/drn-tech-logo.png') }}" alt="DRN TECH">
        </a>
        <h1>Choose a new password</h1>
        <p>Use at least 8 characters and avoid reusing your current password.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="reset-password-field">
                <input
                    type="password"
                    id="new_password"
                    name="new_password"
                    placeholder="New password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <button
                    type="button"
                    class="reset-password-toggle"
                    data-password-toggle="new_password"
                    aria-label="Show new password"
                    aria-pressed="false"
                >
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>

            <div class="reset-password-field">
                <input
                    type="password"
                    id="confirm_password"
                    name="confirm_password"
                    placeholder="Confirm new password"
                    minlength="8"
                    autocomplete="new-password"
                    required
                >
                <button
                    type="button"
                    class="reset-password-toggle"
                    data-password-toggle="confirm_password"
                    aria-label="Show confirm password"
                    aria-pressed="false"
                >
                    <i class="fa-solid fa-eye" aria-hidden="true"></i>
                </button>
            </div>

            <button type="submit">Reset Password</button>
        </form>

        <a href="{{ url_for('login') }}">← Back to Login</a>
    </div>
</div>

<script src="{{ url_for('static', filename='js/reset-password.js') }}"></script>

</body>
</html>
