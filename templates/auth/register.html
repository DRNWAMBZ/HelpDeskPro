<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | DRN TECH</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/register.css') }}">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

</head>

<body class="register-page">

<div class="register-container">

    <div class="register-logo">

        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DRN TECH">

    </div>

    <div class="register-card">

        <h1>Create Account</h1>

        <p class="register-subtitle">

            Join DRN TECH HelpDesk Pro

        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>

                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="input-group">

                <label>Username</label>

                <input
                    type="text"
                    name="username"
                    placeholder="Choose a username"
                    required>

            </div>

           <div class="input-group">

    <label>Email Address</label>

    <input
        type="email"
        name="email"
        placeholder="Enter your email"
        required>

</div>

<div class="input-group">

    <label>Password</label>

    <div class="password-box">

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Create a password"
            required>

        <i class="fa-solid fa-eye toggle-password"
           id="togglePassword"></i>

    </div>

</div>

<div class="input-group">

    <label>Confirm Password</label>

    <div class="password-box">

        <input
            type="password"
            id="confirmPassword"
            name="confirm_password"
            placeholder="Confirm your password"
            required>

        <i class="fa-solid fa-eye toggle-password"
           id="toggleConfirmPassword"></i>

    </div>

</div>            <button class="register-btn">

                Create Account

            </button>

        </form>

        <p class="login-text">

            Already have an account?

            <a href="{{ url_for('login') }}">

                Login

            </a>

        </p>

        <a href="{{ url_for('home') }}" class="back-home">

            ← Back to Homepage

        </a>

    </div>

</div>

<script src="{{ url_for('static', filename='js/register.js') }}"></script>

</body>

</html>
