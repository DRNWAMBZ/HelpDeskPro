<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | DRN TECH</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body class="login-page">

<div class="login-container">

    <!-- Logo -->
    <div class="login-logo">

        <img src="{{ url_for('static', filename='images/logo.png') }}" alt="DRN TECH Logo">

    </div>

    <!-- Card -->
    <div class="login-card">

        <h1>Welcome Back</h1>

        <p class="login-subtitle">
            Sign in to continue to HelpDesk Pro
        </p>

        <!-- Flash Messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash-message {{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- Login Form -->
        <form action="{{ url_for('login') }}" method="POST" id="loginForm">

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="input-group">

                <label>Email Address</label>

                <input
                    type="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                    autofocus>

            </div>

            <div class="input-group">

                <label>Password</label>

                <div class="password-box">

                    <input
                        type="password"
                        name="password"
                        id="password"
                        placeholder="Enter your password"
                        required>

                    <span id="togglePassword" class="toggle-password">
                        <i class="fa-solid fa-eye"></i>
                    </span>

                </div>

            </div>

            <div class="login-options">

                <label class="remember-me">

                    <input type="checkbox" name="remember">

                    Remember Me

                </label>

                <a href="{{ url_for('forgot_password') }}" class="forgot-link">
                    Forgot Password?
                </a>
            </div>

            <button type="submit" class="login-btn" id="loginButton">

                Login

            </button>

        </form>

        <div class="divider">

            <span>OR</span>

        </div>

        <p class="register-text">

            Don't have an account?

            <a href="{{ url_for('register') }}">

                Register

            </a>

        </p>

        <a href="{{ url_for('home') }}" class="back-home">

            ← Back to Homepage

        </a>

    </div>

</div>

<script src="{{ url_for('static', filename='js/login.js') }}"></script>

</body>
</html>
