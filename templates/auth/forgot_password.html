<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forgot Password | DRN TECH</title>

    <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/favicon.png') }}">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/forgot_password.css') }}">

</head>

<body>

<div class="forgot-container">

    <div class="forgot-card">

        <a href="{{ url_for('home') }}" class="auth-brand-mark" aria-label="DRN TECH home">
            <img src="{{ url_for('static', filename='images/drn-tech-logo.png') }}" alt="DRN TECH">
        </a>

        <h1>Forgot Password?</h1>

        <p>
            Enter your email address below and we'll send you a password reset link.
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}

                {% for category, message in messages %}

                    <div class="flash-message {{ category }}">

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}

        <form method="POST">

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <label class="sr-only" for="reset-email">Email address</label>
            <input id="reset-email" type="email" name="email" placeholder="Enter your email" autocomplete="email" required>

            <button type="submit">

                Send Reset Link

            </button>

        </form>

        <a href="{{ url_for('login') }}">

            ← Back to Login

        </a>

    </div>

</div>

</body>

</html>
