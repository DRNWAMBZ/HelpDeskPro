{% extends "base.html" %}

{% block title %}
Add User
{% endblock %}

{% block content %}

<div class="admin-page">

    <div class="admin-header">

        <div>

            <h1>Add User</h1>

            <p>
                Create a new HelpDesk Pro account.
            </p>

        </div>

    </div>


    <div class="admin-card">

        <form
            method="POST"
            class="ticket-form"
        >

            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="input-group">

                <label for="username">
                    Username
                </label>

                <input
                    type="text"
                    id="username"
                    name="username"
                    placeholder="Enter username"
                    required
                >

            </div>


            <div class="input-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter email address"
                    required
                >

            </div>


            <div class="input-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    required
                >

            </div>


            <div class="input-group">

                <label for="role">
                    Account Role
                </label>

                <select
                    id="role"
                    name="role"
                    required
                >

                    <option value="user">
                        Normal User
                    </option>

                    <option value="admin">
                        Administrator
                    </option>

                </select>

            </div>


            <div>

                <button
                    type="submit"
                    class="login-btn"
                >
                    <i class="fa-solid fa-user-plus"></i>
                    Create Account
                </button>

                <a
                    href="{{ url_for('admin_users') }}"
                    class="create-ticket-btn"
                >
                    Cancel
                </a>

            </div>

        </form>

    </div>

</div>

{% endblock %}
